name: Auto Sync Upstream Fork
on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '0 6 * * *' # 每天早上6点自动同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync from upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_repository: punkpeye/awesome-mcp-servers
          target_repository: xjianq/mcp-erpnext
          upstream_branch: main
          target_branch: main
          github_token: ${{ secrets.PAT }}
