name: Auto Sync Upstream Fork
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream punkpeye/awesome-mcp-servers
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "punkpeye/awesome-mcp-servers"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.PAT }}
          sync_tags: true
