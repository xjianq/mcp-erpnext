name: Auto Sync Upstream Fork
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 关键：先检出当前仓库代码，解决 not in a git directory 报错
      - name: Checkout current repo code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Sync upstream punkpeye/awesome-mcp-servers
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "punkpeye/awesome-mcp-servers"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sync_tags: true
